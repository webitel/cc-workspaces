name: Update lib

on:
  workflow_dispatch:
    inputs:
      package:
        description: Which library to update
        required: true
        type: choice
        options:
          - '@webitel/ui-sdk'
          - '@webitel/ui-chats'
          - '@webitel/ui-datalist'
          - '@webitel/api-services'
          - '@webitel/flow-ui-sdk'
          - '@webitel/styleguide'

      version:
        description: 'Version to wait for, e.g. 26.8.34 (see the publish commit message). Leave empty to update to whatever is already published.'
        required: false
        type: string

permissions: { contents: read }

jobs:
  update:
    name: Update lib
    uses: webitel/reusable-workflows/.github/workflows/frontend-npm-dep-update.yml@v2
    permissions:
      id-token: write
      contents: write

    with:
      package: ${{ inputs.package }}
      version: ${{ inputs.version }}

    secrets:
      app-pem: ${{ secrets.DELIVERY_BOT_APP_PEM }}
